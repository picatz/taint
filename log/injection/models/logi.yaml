# Built-in log-injection rules for the logi detector, as data.
# Generated from the detector's sink list; every logging call is a sink
# with default (all-argument) selection.
package: github.com/go-kit/log
sources:
  - type: "*net/http.Request"
  - type: "google.golang.org/protobuf/proto.Message"
sinks:
  - { method: "(github.com/go-kit/log.Logger).Log", kind: log-injection }
---
package: github.com/go-logr/logr
sinks:
  - { method: "(github.com/go-logr/logr.Logger).Error", kind: log-injection }
  - { method: "(github.com/go-logr/logr.Logger).Info", kind: log-injection }
---
