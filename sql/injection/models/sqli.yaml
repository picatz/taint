# Built-in SQL-injection rules for the sqli detector, as data.
# Generated from the detector's sink list. Selection defaults to the
# engine's built-in selector for each method (e.g. the SQL text after a
# context argument for pgx/gdb methods).
package: database/sql
sources:
  - type: "*net/http.Request"
  - type: "google.golang.org/protobuf/proto.Message"
sinks:
  - { method: "(*database/sql.Conn).ExecContext", kind: sql-injection }
  - { method: "(*database/sql.Conn).PrepareContext", kind: sql-injection }
  - { method: "(*database/sql.Conn).QueryContext", kind: sql-injection }
  - { method: "(*database/sql.Conn).QueryRowContext", kind: sql-injection }
  - { method: "(*database/sql.DB).Exec", kind: sql-injection }
  - { method: "(*database/sql.DB).ExecContext", kind: sql-injection }
  - { method: "(*database/sql.DB).Prepare", kind: sql-injection }
  - { method: "(*database/sql.DB).PrepareContext", kind: sql-injection }
  - { method: "(*database/sql.DB).Query", kind: sql-injection }
  - { method: "(*database/sql.DB).QueryContext", kind: sql-injection }
  - { method: "(*database/sql.DB).QueryRow", kind: sql-injection }
  - { method: "(*database/sql.DB).QueryRowContext", kind: sql-injection }
  - { method: "(*database/sql.Tx).Exec", kind: sql-injection }
  - { method: "(*database/sql.Tx).ExecContext", kind: sql-injection }
  - { method: "(*database/sql.Tx).Prepare", kind: sql-injection }
  - { method: "(*database/sql.Tx).PrepareContext", kind: sql-injection }
  - { method: "(*database/sql.Tx).Query", kind: sql-injection }
  - { method: "(*database/sql.Tx).QueryContext", kind: sql-injection }
  - { method: "(*database/sql.Tx).QueryRow", kind: sql-injection }
  - { method: "(*database/sql.Tx).QueryRowContext", kind: sql-injection }
---
package: github.com/Masterminds/squirrel
sinks:
  - { method: "github.com/Masterminds/squirrel.Expr", kind: sql-injection }
