# Manual precision evaluation. Runs cmd/taint-eval against the pinned
# fixtures and remote repositories in testdata/eval/targets.yaml and fails
# on snapshot drift. This workflow is intentionally NOT wired into the
# default PR path because:
#   - it clones third-party repositories at network-bound time, and
#   - it gates on analyzer precision, which is reviewed separately from
#     functional correctness.
#
# Trigger it manually from the Actions tab before a release, after
# touching the taint engine, or when validating an analyzer change.
name: Precision Eval (manual)

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Optional target selector (name, 'local', or 'git'). Empty means all."
        required: false
        default: ""

permissions:
  contents: read

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - name: List targets
        run: go run ./cmd/taint-eval list

      - name: Check snapshots
        env:
          TARGET: ${{ inputs.target }}
        run: |
          if [ -n "$TARGET" ]; then
            if ! printf '%s' "$TARGET" | grep -Eq '^[A-Za-z0-9._/-]+$'; then
              echo "::error::target must match ^[A-Za-z0-9._/-]+$" >&2
              exit 1
            fi
            go run ./cmd/taint-eval check -target "$TARGET"
          else
            go run ./cmd/taint-eval check
          fi

      # Ground-truth scoreboard (precision/recall vs the manifest's expect
      # entries). Informational: `report` never fails on the numbers, only
      # on infrastructure errors, so this step does not gate the workflow
      # beyond surfacing load failures. Runs even if `check` drifted.
      - name: Precision/recall report
        if: ${{ always() }}
        env:
          TARGET: ${{ inputs.target }}
        run: |
          if [ -n "$TARGET" ]; then
            if ! printf '%s' "$TARGET" | grep -Eq '^[A-Za-z0-9._/-]+$'; then
              echo "::error::target must match ^[A-Za-z0-9._/-]+$" >&2
              exit 1
            fi
            go run ./cmd/taint-eval report -target "$TARGET"
          else
            go run ./cmd/taint-eval report
          fi
