# This workflow runs go build and test for each
# push and pull request to the main branch.
name: Build and Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:

  build:
    name: build (Go ${{ matrix.go }})
    runs-on: ubuntu-latest
    # SSA-heavy detector suites run serially below to bound peak memory.
    # Leave room for their package-loading work on standard hosted runners.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        go: ["1.26.x", "1.27.x"]
    env:
      # Verify the selected version, without auto-switching to go.mod's
      # preferred toolchain and accidentally testing it twice.
      GOTOOLCHAIN: local
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

    - name: Setup Go
      uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
      with:
        go-version: ${{ matrix.go }}
        check-latest: true

    - name: Build
      run: go build -v ./...

    - name: Test
      run: go test -p 1 -v ./...

  vet:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

    - name: Setup Go
      uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
      with:
        go-version-file: go.mod

    - name: go vet
      run: go vet ./...

  fmt:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

    - name: Setup Go
      uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
      with:
        go-version-file: go.mod

    - name: gofmt
      run: |
        unformatted="$(gofmt -l .)"
        if [ -n "$unformatted" ]; then
          echo "::error::gofmt found unformatted files:"
          echo "$unformatted"
          exit 1
        fi

  # Race detector coverage is scoped to the root package and callgraphutil,
  # rather than the full ./... suite. Locally, `go test -race ./...` takes
  # ~5.5 minutes wall-clock with high parallelism (many cores); GitHub's
  # standard runners have far fewer, slower cores, and the root package alone
  # accounts for the bulk of that time (~5 minutes under race). Running the
  # full suite under race on a standard runner risks pushing well past a
  # reasonable CI budget (our informal ceiling is ~20 minutes), so this job
  # covers the two packages most central to the taint engine's concurrency
  # surface (callgraph construction and traversal) instead of every package.
  race:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

    - name: Setup Go
      uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
      with:
        go-version-file: go.mod

    - name: Test with race detector (root + callgraphutil)
      run: go test -race -v . ./callgraphutil/...

  govulncheck:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

    - name: Setup Go
      uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
      with:
        go-version-file: go.mod

    # Keep reachable vulnerability findings blocking. The vulnerability
    # database is refreshed at run time; the scanner version is reproducible.
    - name: govulncheck
      run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  staticcheck:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

    - name: Setup Go
      uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
      with:
        go-version-file: go.mod

    - name: staticcheck
      run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.1 ./...
