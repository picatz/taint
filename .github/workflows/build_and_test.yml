# This workflow runs go build and test for each
# push and pull request to the main branch.
name: Build and Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

    - name: Setup Go
      uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
      with:
        go-version-file: go.mod

    - name: Build
      run: go build -v ./...

    - name: Test
      run: go test -v ./...

  vet:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

    - name: Setup Go
      uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
      with:
        go-version-file: go.mod

    - name: go vet
      run: go vet ./...

  fmt:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

    - name: Setup Go
      uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
      with:
        go-version-file: go.mod

    - name: gofmt
      run: |
        unformatted="$(gofmt -l .)"
        if [ -n "$unformatted" ]; then
          echo "::error::gofmt found unformatted files:"
          echo "$unformatted"
          exit 1
        fi

  # Race detector coverage is scoped to the root package and callgraphutil,
  # rather than the full ./... suite. Locally, `go test -race ./...` takes
  # ~5.5 minutes wall-clock with high parallelism (many cores); GitHub's
  # standard runners have far fewer, slower cores, and the root package alone
  # accounts for the bulk of that time (~5 minutes under race). Running the
  # full suite under race on a standard runner risks pushing well past a
  # reasonable CI budget (our informal ceiling is ~20 minutes), so this job
  # covers the two packages most central to the taint engine's concurrency
  # surface (callgraph construction and traversal) instead of every package.
  race:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

    - name: Setup Go
      uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
      with:
        go-version-file: go.mod

    - name: Test with race detector (root + callgraphutil)
      run: go test -race -v . ./callgraphutil/...

  govulncheck:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

    - name: Setup Go
      uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
      with:
        go-version-file: go.mod

    # NOTE: as of adding this job, govulncheck reports real, currently
    # reachable vulnerabilities: several golang.org/x/crypto/ssh and
    # golang.org/x/net advisories, one github.com/go-git/go-git/v5 advisory
    # (all fixed by bumping those modules), plus stdlib advisories fixed in
    # newer Go point releases. Fixing those is a dependency/toolchain bump
    # outside this CI-hardening workstream's scope (go.mod isn't owned
    # here), so this job is intentionally left failing until that follow-up
    # lands rather than suppressed — unlike the gofmt/staticcheck exclusions
    # above, these are real vulnerabilities, not pre-existing style debt.
    - name: govulncheck
      run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  staticcheck:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

    - name: Setup Go
      uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
      with:
        go-version-file: go.mod

    - name: staticcheck
      run: go run honnef.co/go/tools/cmd/staticcheck@latest ./...
