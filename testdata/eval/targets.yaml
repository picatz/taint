# Precision evaluation manifest.
#
# Each target is invoked against the existing analyzer CLIs
# (cmd/sqli, cmd/logi, cmd/cmdi, cmd/xss, cmd/ptrv, cmd/ssrf) and compared
# against a JSON snapshot under testdata/eval/snapshots.
#
# Local targets live under testdata/eval/fixtures and are
# resolved relative to this file. They have no network needs
# and are checked by `taint-eval check -target local`.
#
# Git targets are cloned into the cache directory
# (TAINT_EVAL_CACHE or .cache/taint-eval) at a pinned commit.
# Treat them as expected-clean unless intentional findings
# are recorded in their snapshot.
#
# `expect` entries are ground truth: known-vulnerable sinks the named
# analyzer SHOULD report (file relative to the target root; line 0 matches
# any line in the file; note is a CVE/advisory reference). `taint-eval
# report` scores runs against them — matched entries are true positives,
# missed entries false negatives, and findings not covered by any entry are
# unexpected. Snapshots stay purely descriptive (drift baseline), so a
# recorded miss in the snapshot and a missed expect entry can coexist:
# that is the engine's real recall, not a harness error.

targets:
  - name: local-clean
    kind: local
    path: fixtures/local-clean
    packages: ["./..."]
    analyzers: [sqli, logi, cmdi, xss, ptrv, ssrf]

  - name: local-sqli-positive
    kind: local
    path: fixtures/local-sqli-positive
    packages: ["./..."]
    analyzers: [sqli]
    expect:
      - analyzer: sqli
        file: main.go
        line: 12
        note: fixture true positive

  - name: local-logi-positive
    kind: local
    path: fixtures/local-logi-positive
    packages: ["./..."]
    analyzers: [logi]
    expect:
      - analyzer: logi
        file: main.go
        line: 10
        note: fixture true positive

  - name: local-cmdi-positive
    kind: local
    path: fixtures/local-cmdi-positive
    packages: ["./..."]
    analyzers: [cmdi]
    expect:
      - analyzer: cmdi
        file: main.go
        line: 10
        note: fixture true positive

  - name: local-xss-positive
    kind: local
    path: fixtures/local-xss-positive
    packages: ["./..."]
    analyzers: [xss]
    expect:
      - analyzer: xss
        file: main.go
        line: 9
        note: fixture true positive

  - name: local-ptrv-positive
    kind: local
    path: fixtures/local-ptrv-positive
    packages: ["./..."]
    analyzers: [ptrv]
    expect:
      - analyzer: ptrv
        file: main.go
        line: 10
        note: fixture true positive

  - name: local-ssrf-positive
    kind: local
    path: fixtures/local-ssrf-positive
    packages: ["./..."]
    analyzers: [ssrf]
    expect:
      - analyzer: ssrf
        file: main.go
        line: 10
        note: fixture true positive

  # --- Known-vulnerable targets. `expect` entries are ground truth from
  # --- published CVEs/advisories (or, for go-dvwa, the app's own docs).
  # --- Misses here are real recall data, not harness bugs.

  - name: sqreen-go-dvwa
    kind: git
    repo: https://github.com/sqreen/go-dvwa.git
    # master (archived repo; no releases)
    commit: 822f4bf8d04972fc7af221e713726174a4ef10f4
    packages: ["./..."]
    analyzers: [sqli, logi, cmdi, xss, ptrv, ssrf]
    # Both demo flows cross a package boundary (a gorilla/mux handler in the
    # server package into the vulnerable package), which a per-package pass
    # cannot follow. Measure this one whole-program.
    whole-program: true
    expect:
      - analyzer: sqli
        file: vulnerable/sql.go
        line: 69
        note: go-dvwa demo SQLi; category from r.FormValue concatenated into db.QueryContext
      - analyzer: cmdi
        file: vulnerable/system.go
        line: 9
        note: go-dvwa demo command injection; extra from r.FormValue reaches exec.CommandContext sh -c

  - name: gogs-cve-2024-39930
    kind: git
    repo: https://github.com/gogs/gogs.git
    # v0.13.0 (vulnerable; fixed in v0.13.1)
    commit: 8c21874c00b6100d46b662f65baeb40647442f42
    # Scoped to the package containing the vulnerable flow: loading all of
    # gogs is slow and the CVE lives entirely inside internal/ssh.
    packages: ["./internal/ssh"]
    analyzers: [cmdi]
    expect:
      - analyzer: cmdi
        file: internal/ssh/ssh.go
        line: 73
        note: CVE-2024-39930 argument injection; SSH env request name/value reach com.ExecCmd("env", ...)

  - name: casdoor-cve-2022-24124
    kind: git
    repo: https://github.com/casdoor/casdoor.git
    # v1.13.0 (vulnerable; fixed by commit 5ec0c7a)
    commit: 051752340d21470db4020b9cf1b46fa50ae908a9
    # Scoped to the packages containing the vulnerable flow (beego
    # controller -> object query builder); loading all of casdoor is slow.
    packages: ["./controllers", "./object"]
    analyzers: [sqli]
    expect:
      - analyzer: sqli
        file: object/adapter.go
        line: 198
        note: CVE-2022-24124 SQLi; field query param from /api/get-organizations reaches xorm Session.And via fmt.Sprintf in GetSession
      - analyzer: sqli
        file: object/organization.go
        line: 44
        note: CVE-2022-24124 SQLi; same field filter pattern in GetOrganizationCount

  - name: prest-ghsa-p46v-f2x8-qp98
    kind: git
    repo: https://github.com/prest/prest.git
    # v2.0.0-rc2 (version reviewed in the advisory; SQLi is systemic and
    # unpatched as of the review)
    commit: 03937fb164390e66ce86e378abee11ee9b23c484
    # Scoped to the vulnerable flow: REST controllers -> postgres adapter.
    packages: ["./controllers/...", "./adapters/..."]
    analyzers: [sqli]
    expect:
      - analyzer: sqli
        file: adapters/postgres/postgres.go
        # line 0: the advisory lists many injection points in this file;
        # the canonical one is SelectSQL's fmt.Sprintf concat at line 1601
        # (db/schema/table path params concatenated into the query).
        note: GHSA-p46v-f2x8-qp98 systemic SQLi; request db/schema/table concatenated in SelectSQL and friends

  - name: ekuiper-ghsa-r5ph-4jxm-6j9p
    kind: git
    repo: https://github.com/lf-edge/ekuiper.git
    # v1.14.0 (vulnerable; fixed in v1.14.2)
    commit: ef938601ad2dd467816f0f849022cc41a0525a03
    # Scoped to the store subtree containing the vulnerable sink. The
    # user-input source (rule id from the REST API) lives in
    # internal/server, which drags in the whole application; the engine
    # analyzes per package and cannot follow that cross-package flow
    # anyway, so the sink package is the honest unit to measure.
    packages: ["./internal/pkg/store/..."]
    analyzers: [sqli]
    expect:
      - analyzer: sqli
        file: internal/pkg/store/sql/sqlKv.go
        line: 93
        note: GHSA-r5ph-4jxm-6j9p SQLi; rule id reaches db.QueryRow via fmt.Sprintf in sqlKvStore.Get

  # --- Clean router libraries, measured whole-program. These are real
  # --- repositories, so the whole-program scanner (taint scan) is the right
  # --- tool: it is what scans a whole application, and its complete call
  # --- graph is more precise than per-package analysis, whose incomplete
  # --- graph can produce spurious paths (e.g. a false XSS on a handler that
  # --- writes a constant, which whole-program correctly rejects). The
  # --- per-package analyzers are validated separately by their analysistest
  # --- suites.
  - name: gorilla-mux
    kind: git
    repo: https://github.com/gorilla/mux.git
    # v1.8.1
    commit: b4617d0b9670ad14039b2739167fd35a60f557c5
    packages: ["./..."]
    analyzers: [sqli, logi, cmdi, xss, ptrv, ssrf]
    whole-program: true

  - name: julienschmidt-httprouter
    kind: git
    repo: https://github.com/julienschmidt/httprouter.git
    # v1.3.0
    commit: 4eec211fa4e8df74ed978dc5681612131854144f
    packages: ["./..."]
    analyzers: [sqli, logi, cmdi, xss, ptrv, ssrf]
    whole-program: true

  - name: go-chi-chi
    kind: git
    repo: https://github.com/go-chi/chi.git
    # v5.2.1
    commit: 71307f9b7e4e9527638bc951c42b782cd1560331
    packages: ["./..."]
    analyzers: [sqli, logi, cmdi, xss, ptrv, ssrf]
    whole-program: true
