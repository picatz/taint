# Built-in path-traversal (CWE-22) rules for the ptrv detector, as data.
# Filesystem APIs keyed by a path argument are sinks; the path-argument
# selector comes from the engine's built-in sink-argument rules for each
# method, so the sinks are listed here without repeating those selectors.
package: net/http
sources:
  - type: "*net/http.Request"
  - type: "google.golang.org/protobuf/proto.Message"
sinks:
  - { method: net/http.ServeFile, kind: path-traversal }
---
package: os
sinks:
  - { method: os.Open, kind: path-traversal }
  - { method: os.OpenFile, kind: path-traversal }
  - { method: os.Create, kind: path-traversal }
  - { method: os.ReadFile, kind: path-traversal }
  - { method: os.WriteFile, kind: path-traversal }
  - { method: os.Remove, kind: path-traversal }
  - { method: os.RemoveAll, kind: path-traversal }
  - { method: os.Mkdir, kind: path-traversal }
  - { method: os.MkdirAll, kind: path-traversal }
---
package: io/ioutil
sinks:
  - { method: io/ioutil.ReadFile, kind: path-traversal }
  - { method: io/ioutil.WriteFile, kind: path-traversal }
  - { method: io/ioutil.ReadDir, kind: path-traversal }
